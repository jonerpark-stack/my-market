<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>JP View</title>
<style>
/* 터미널형: 검정 바탕, 앰버 강조, 상승 빨강/하락 파랑, 고정폭 숫자 */
:root{
  --bg:#0a0a0a; --panel:#111; --ink:#d9d9d9; --sub:#7a7a7a; --line:#222;
  --amber:#ffb000; --amber-ink:#1a1200; --up:#ff5f56; --down:#4da3ff; --ai:#9be39b; --kakao:#fee500;
  --mono:"JetBrains Mono","D2Coding",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.mono{font-family:var(--mono)}

#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
#lock h1{margin:0;font-size:22px;font-family:var(--mono);color:var(--amber)}
#lock input{width:100%;max-width:320px;padding:14px;border-radius:6px;border:1px solid #333;background:var(--panel);color:var(--ink);font-size:16px}
#lock label{font-size:14px;color:var(--sub)}
.btn-primary{width:100%;max-width:320px;padding:14px;border:0;border-radius:6px;background:var(--amber);color:var(--amber-ink);font-weight:800}
#lockMsg{color:var(--up);font-size:14px;min-height:20px}

header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.top h1{margin:0;font:800 17px var(--mono);color:var(--amber);letter-spacing:.5px}
.top .meta{display:flex;align-items:center;gap:6px;color:var(--sub);font:12px var(--mono)}
.icon-btn{border:1px solid #333;background:transparent;border-radius:6px;width:36px;height:36px;font-size:15px}
.tabs{display:flex;gap:0;padding:4px 16px 0}
.tab{flex:1;border:0;background:none;padding:9px 0;font:700 14px var(--mono);color:var(--sub);border-bottom:2px solid #222}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #333;background:transparent;border-radius:4px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.badge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:6px;border-radius:3px;background:var(--up);color:#fff;font:700 10px var(--mono);text-align:center}

main{padding:0 16px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold .fa{margin-left:auto;color:var(--sub);transition:transform .15s}
details.fold:not([open]) .fa{transform:rotate(-90deg)}
.sec{margin:18px 0 0;padding:6px 0;font:700 12px var(--mono);color:var(--sub);border-bottom:1px dashed #333;letter-spacing:.5px}
.card{padding:14px 0 14px;border-bottom:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:8px;font:700 12px var(--mono);color:var(--amber);letter-spacing:.3px}
.card-h .nm{color:var(--ink);font-family:inherit}
.new{background:var(--up);color:#fff;border-radius:3px;padding:0 5px;font-size:10px}
.fwd{font-size:12px;color:var(--sub);margin-top:4px}
.ticks{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;margin:10px 0 2px;font:13px/1.5 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ticks .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticks .u{color:var(--up);text-align:right} .ticks .d{color:var(--down);text-align:right}
.body{white-space:pre-wrap;word-break:break-word;overflow:hidden;margin-top:8px;font-size:14.5px;color:#c8c8c8}
.body.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.body a{color:var(--down)}
.linkcard{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border:1px solid #333;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
.linkcard span{color:var(--sub);font:12px var(--mono)}
.more{border:0;background:none;color:var(--amber);padding:6px 0 0;font:700 13px var(--mono)}
.photos{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.photos img{height:110px;border-radius:6px;flex:none}
.docs{margin-top:8px;font-size:13px}
.docs div{padding:7px 10px;border:1px dashed #333;border-radius:6px;margin-top:4px}
details.ai{margin-top:10px}
details.ai summary{list-style:none;cursor:pointer;font:13px/1.5 var(--mono);color:var(--ai)}
details.ai summary::-webkit-details-marker{display:none}
details.ai summary .hint{color:var(--sub)}
.ai-body{font-size:13.5px;padding:6px 0 0 14px;color:#b9d9b9;border-left:1px solid #2a4a2a;margin-top:6px}
.ai-body p{margin:0 0 5px}
.ai-body .note{font-size:11px;color:var(--sub);margin-top:6px}
.tags{margin-top:8px;color:var(--amber);font:12px var(--mono);opacity:.85}
.actions{display:flex;gap:8px;margin-top:12px}
.act{flex:1;border:1px solid #333;border-radius:6px;padding:9px;font:700 13px var(--mono);text-align:center;text-decoration:none;background:transparent;color:var(--ink)}
.act.kakao{background:var(--kakao);border-color:var(--kakao);color:#191919}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-family:var(--mono)}
.rep{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.rep .t{font-weight:700;font-size:15px;margin:2px 0}
.rep .s{font:12px var(--mono);color:var(--sub)}

#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end}
.sheet-in{background:#141414;border-top:1px solid #333;width:100%;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-in h2{margin:0 0 10px;font:800 15px var(--mono);color:var(--amber)}
.sheet-in textarea{width:100%;min-height:200px;border:1px solid #333;border-radius:6px;padding:12px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;line-height:1.5}
.opts{display:flex;gap:16px;margin:10px 0 4px;font-size:14px;flex-wrap:wrap}
.off{color:var(--sub);font-size:12px;margin-bottom:8px}
#chartWrap img{width:100%;border-radius:6px;border:1px solid #333}
.sheet-btns{display:flex;gap:8px;margin-top:12px}
.sheet-btns button{flex:1;padding:13px;border:1px solid #333;border-radius:6px;font-weight:800}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--amber);color:var(--amber-ink);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<section id="lock">
  <h1>📊 내 시황</h1>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <label><input id="remember" type="checkbox" checked> 이 기기에서 비밀번호 기억</label>
  <button class="btn-primary" id="unlockBtn">열기</button>
  <div id="lockMsg"></div>
</section>

<!-- 앱 -->
<section id="app" class="hidden">
  <header>
    <div class="top">
      <h1>JP View</h1>
      <div class="meta">
        <span id="updated">-</span>
        <button class="icon-btn" id="refreshBtn" aria-label="새로고침">🔄</button>
        <button class="icon-btn" id="settingsBtn" aria-label="키워드 설정">⚙️</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="home">전체</button>
      <button class="tab" data-tab="telegram">텔레그램 시황</button>
      <button class="tab" data-tab="report">리포트</button>
    </nav>
    <div class="chips" id="chips"></div>
  </header>
  <main id="feed"></main>
</section>

<!-- 카톡 공유 시트 -->
<div id="sheet" class="hidden">
  <div class="sheet-in">
    <h2>💬 카카오톡으로 보내기</h2>
    <textarea id="shareText"></textarea>
    <div class="opts">
      <label><input type="checkbox" id="optAi" checked> 🤖 AI 코멘트 포함</label>
      <label><input type="checkbox" id="optChart" checked> 📊 차트 이미지</label>
      
    </div>
    <div class="off" id="aiOff"></div>
    <div id="chartWrap"></div>
    <div class="sheet-btns">
      <button id="sheetClose" style="background:var(--bg);color:var(--ink)">닫기</button>
      <button id="sheetSend" style="background:var(--kakao);color:#191919">보내기</button>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
/* ---------- 저장소(브라우저) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const DEFAULT_KEYWORDS = ["FOMC","연준","파월","금통위","한은","금리","국채","환율","원/달러","CPI","PCE","고용","유가","반도체","엔비디아","관세"];
const EMOJI_RULES = [
  [/FOMC|연준|파월|Fed/i,"🏛️"],[/금통위|한은|한국은행/,"🏦"],[/국채|금리|채권|yield/i,"📜"],
  [/환율|원\/달러|달러|엔화|DXY/i,"💵"],[/유가|WTI|브렌트|원유/i,"🛢️"],[/금값|금 |gold/i,"🥇"],
  [/CPI|PPI|PCE|물가|인플레/i,"🧾"],[/고용|실업|NFP|비농업/,"👷"],[/반도체|엔비디아|NVIDIA|마이크론|SK하이닉스|삼성전자/i,"💾"],
  [/나스닥|S&P|다우|미국 증시|뉴욕/i,"🇺🇸"],[/코스피|코스닥|KOSPI/i,"🇰🇷"],[/중국|위안|항셍/,"🇨🇳"],
  [/일본|닛케이|BOJ/i,"🇯🇵"],[/비트코인|이더리움|크립토|BTC/i,"🪙"],[/관세|무역/,"🚢"]
];

let DATA = null, PASSWORD = null;
let state = { tab: store.get("tab2","home"), chip: store.get("chip2", null) };
let seen = store.get("seen", {});          // 채널별 마지막으로 본 메시지 ID
let seenAtOpen = {...seen};                // 이번 접속 시점의 기준(🆕 표시용)
let keywords = store.get("keywords", DEFAULT_KEYWORDS);
let sharePost = null, chartBlob = null;

/* ---------- 복호화 (Python 쪽 AES-GCM + PBKDF2와 동일) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptEnv(env, password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(env.salt), iterations:env.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.iv)}, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadData(password){
  if(password === null){
    const r0 = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(!r0.ok) throw new Error("데이터 파일이 아직 없습니다. Actions가 한 번 실행되어야 합니다.");
    return r0.json();
  }
  const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("데이터 파일이 아직 없습니다. Actions가 한 번 실행되어야 합니다.");
  return decryptEnv(await r.json(), password);
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chName = id => (DATA.channels.find(c => c.id === id) || {name:id}).name;
const chEmoji = id => (DATA.channels.find(c => c.id === id) || {emoji:"📌"}).emoji;
function fmtTime(iso){
  const d = new Date(iso), now = new Date();
  const hm = d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"});
  const md = d.toLocaleDateString("ko-KR",{month:"numeric",day:"numeric",timeZone:"Asia/Seoul"});
  const today = now.toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul"}) === d.toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul"});
  return today ? hm : `${md} ${hm}`;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.add("hidden"), 2200); }
function richText(text){
  let h = esc(text).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return h;
}

/* ---------- 렌더링 ---------- */
function postsFor(tab, chip){
  return DATA.posts.filter(p => (tab === "report" ? p.report : true) && (chip === "all" || p.channel === chip));
}
function renderChips(){
  const chans = DATA.channels.filter(c => (c.source || "telegram") === "telegram");
  const counts = {};
  for(const c of chans){
    counts[c.id] = DATA.posts.filter(p => p.channel === c.id && p.id > (seen[c.id] || 0) && (state.tab !== "report" || p.report)).length;
  }
  const chip = (id, label, n) => `<button class="chip ${state.chip===id?"on":""}" data-chip="${id}">${label}${n?`<span class="badge">${n}</span>`:""}</button>`;
  $("#chips").innerHTML = chans.map(c => chip(c.id, esc(c.name), state.chip===c.id ? 0 : counts[c.id])).join("");
  $("#chips").classList.toggle("hidden", state.tab !== "telegram");
}
function aiHtml(ai){
  if(!ai) return "";
  const li = arr => (arr||[]).map(x => `<p>${esc(x)}</p>`).join("");
  return `<details class="ai"><summary>AI› ${esc((ai.key||"").replace(/^🔑\s*/,""))} <span class="hint">▾</span></summary><div class="ai-body">
    ${li(ai.watch)}${li(ai.background)}${ai.implication?`<p>${esc(ai.implication)}</p>`:""}
    <div class="note">${esc(ai.model||"AI")} 생성 · 투자 판단 참고용, 원문 확인 필요</div></div></details>`;
}
function tagsFor(p){
  const t = keywords.filter(k => k && p.text.toLowerCase().includes(k.toLowerCase())).slice(0,6);
  return t.length ? `<div class="tags">${t.map(k=>"#"+esc(k.replace(/\s+/g,""))).join(" ")}</div>` : "";
}
const MEDIA = {"newspim.com":"뉴스핌","hankyung.com":"한국경제","mk.co.kr":"매일경제","yna.co.kr":"연합뉴스","edaily.co.kr":"이데일리","sedaily.com":"서울경제","mt.co.kr":"머니투데이","chosun.com":"조선일보","bloomberg.com":"Bloomberg","reuters.com":"Reuters","wsj.com":"WSJ","ft.com":"FT","cnbc.com":"CNBC","youtube.com":"YouTube","youtu.be":"YouTube"};
function mediaName(u){
  try{ const h = new URL(u).hostname.replace(/^www\.|^m\./,""); const k = Object.keys(MEDIA).find(d => h === d || h.endsWith("."+d)); return k ? MEDIA[k] : h; }catch(e){ return "링크"; }
}
const isLinkOnly = p => /^\s*https?:\/\/\S+\s*$/.test(p.text);
function ticksHtml(p){
  const mv = extractMoves(p.text).slice(0,6);
  if(mv.length < 2) return "";
  return `<div class="ticks">${mv.map(m => `<span class="l">${esc(m.label)}</span><span class="${m.v>=0?"u":"d"}">${m.v>=0?"▲":"▼"}${m.unit==="bp"?Math.abs(m.v).toFixed(1)+"bp":Math.abs(m.v).toFixed(2)+"%"}</span>`).join("")}</div>`;
}
function cardHtml(p){
  const isNew = p.id > (seenAtOpen[p.channel] || 0);
  const linkOnly = isLinkOnly(p);
  const long = !linkOnly && (p.text.split("\n").length > 5 || p.text.length > 220);
  const t = new Date(p.date).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"});
  return `<article class="card" data-uid="${esc(p.uid)}">
    <div class="card-h"><span>${esc(p.channel.toUpperCase())} · ${t}</span><span class="nm">${chEmoji(p.channel)} ${esc(chName(p.channel))}</span>${isNew?'<span class="new">NEW</span>':""}</div>
    ${p.forwarded?`<div class="fwd">↪︎ ${esc(p.forwarded)}에서 전달</div>`:""}
    ${ticksHtml(p)}
    ${linkOnly
      ? `<a class="linkcard" href="${esc(p.text.trim())}" target="_blank" rel="noopener">📰 ${esc(mediaName(p.text.trim()))} 기사 보기 <span>↗</span></a>`
      : `<div class="body ${long?"clamp":""}">${richText(p.text)}</div>${long?'<button class="more">더보기 ▾</button>':""}`}
    ${p.photos&&p.photos.length?`<div class="photos">${p.photos.map(u=>`<img loading="lazy" src="${esc(u)}" alt="">`).join("")}</div>`:""}
    ${p.docs&&p.docs.length?`<div class="docs">${p.docs.map(d=>`<div>📎 ${esc(d)}</div>`).join("")}</div>`:""}
    ${aiHtml(p.ai)}
    ${tagsFor(p)}
    <div class="actions">
      <button class="act kakao" data-share="${esc(p.uid)}">💬 카톡</button>
      <a class="act" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 원문</a>
    </div></article>`;
}
function reportHtml(p){
  const title = (p.docs && p.docs[0]) || p.text.split("\n").find(l => l.trim()) || "리포트";
  const pdf = (p.links||[]).find(l => /\.pdf($|\?)/i.test(l)) || (p.links||[])[0] || p.url;
  return `<a class="rep" href="${esc(pdf)}" target="_blank" rel="noopener">
    <div class="s">${chEmoji(p.channel)} ${esc(chName(p.channel))} · ${fmtTime(p.date)}</div>
    <div class="t">📄 ${esc(title.slice(0,80))}</div>
    <div class="s">${esc(p.text.replace(/\s+/g," ").slice(0,90))}</div></a>`;
}
function dayKey(iso){ return new Date(iso).toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short",timeZone:"Asia/Seoul"}); }
function grouped(list, fn){
  let out = "", cur = null;
  const counts = {};
  list.forEach(p => { const k = dayKey(p.date); counts[k] = (counts[k]||0) + 1; });
  const today = dayKey(new Date().toISOString());
  for(const p of list){
    const k = dayKey(p.date);
    if(k !== cur){
      cur = k;
      out += `<div class="sec">── ${k === today ? "TODAY · " : ""}${esc(k)} · ${counts[k]}건</div>`;
    }
    out += fn(p);
  }
  return out;
}
function homeHtml(){
  const latest = DATA.channels.map(c => DATA.posts.find(p => p.channel === c.id && !isLinkOnly(p))).filter(Boolean);
  const fold = store.get("fold", {});
  const box = (id, t, body) => `<details class="fold" data-fold="${id}" ${fold[id] ? "" : "open"}><summary class="sec">── ${t} <span class="fa">▾</span></summary>${body}</details>`;
  const soon = `<div class="linkcard" style="display:block;color:var(--sub);font-size:13px">관심 종목 시세 · 스크리너 · DART 공시 · 관심 종목 리포트<br>→ 키 등록 후 활성화 예정</div>`;
  const rows = latest.map(p => {
    const t = new Date(p.date).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"});
    const line = p.ai && p.ai.key ? "AI› " + p.ai.key.replace(/^🔑\s*/,"") : p.text.split("\n").find(l=>l.trim()) || "";
    const isNew = p.id > (seen[p.channel] || 0);
    return `<div class="card" style="cursor:pointer" data-go="${esc(p.channel)}">
      <div class="card-h"><span>${esc(chName(p.channel))}</span><span style="color:var(--sub)">${fmtTime(p.date)}</span>${isNew?'<span class="new">NEW</span>':""}</div>
      ${ticksHtml(p)}
      <div class="body" style="${p.ai?"color:var(--ai)":""};display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical">${esc(line)}</div></div>`;
  }).join("");
  return box("watch", "관심 종목 · 스크리너", soon) + box("latest", "채널별 최신 시황", rows || `<div class="empty">아직 글이 없습니다.</div>`);
}
function render(){
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  if(!state.chip || !DATA.channels.some(c=>c.id===state.chip)) state.chip = DATA.channels[0].id;
  markSeen();
  renderChips();
  if(state.tab === "home"){ $("#feed").innerHTML = homeHtml(); $("#updated").textContent = "갱신 " + fmtTime(DATA.updated); return; }
  const list = state.tab === "report" ? DATA.posts.filter(p => p.report) : postsFor(state.tab, state.chip);
  $("#feed").innerHTML = list.length
    ? (state.tab === "report" ? grouped(list, reportHtml) : grouped(list.slice(0,150), cardHtml))
    : `<div class="empty">표시할 글이 없습니다.</div>`;
  $("#updated").textContent = "갱신 " + fmtTime(DATA.updated);
}
function markSeen(){
  if(state.tab !== "telegram") return;
  const ids = [state.chip];
  for(const id of ids){
    const max = Math.max(0, ...DATA.posts.filter(p=>p.channel===id).map(p=>p.id));
    if(max > (seen[id]||0)) seen[id] = max;
  }
  store.set("seen", seen);
}

/* ---------- 카톡 공유: 이모지 텍스트 ---------- */
function decorateLine(line){
  let l = line.trim().replace(/^[-•·▪︎◦*]\s*/, "");
  if(!l) return "";
  const em = EMOJI_RULES.find(([re]) => re.test(l));
  const pct = l.match(/([+\-−▲▼△▽])\s?\d+(\.\d+)?\s?(%|bp)/);
  let trend = "";
  if(pct) trend = /[+▲△]/.test(pct[1]) ? " 📈" : " 📉";
  return `${em ? em[1] + " " : "• "}${l}${trend}`;
}
function buildShareText(p, withAi){
  if(isLinkOnly(p)) return `📊 [${chName(p.channel)}] ${fmtTime(p.date)}\n\n📰 ${mediaName(p.text.trim())} 기사\n${p.text.trim()}\n\n🔗 원문: ${p.url}`;
  const lines = p.text.split("\n").map(decorateLine).filter(Boolean);
  const head = `📊 [${chName(p.channel)}] ${fmtTime(p.date)}`;
  let body = lines.slice(0,14).join("\n");
  if(lines.length > 14) body += "\n… (이하 원문 참고)";
  let ai = "";
  if(withAi && p.ai){
    ai = "\n\n🤖 AI 코멘트\n" + [p.ai.key, ...(p.ai.watch||[]), p.ai.implication].filter(Boolean).join("\n");
  }
  return `${head}\n\n${body}${ai}\n\n🔗 원문: ${p.url}`;
}

/* ---------- 카톡 공유: 등락 차트 이미지 ---------- */
function extractMoves(text){
  const out = [];
  for(const raw of text.split("\n")){
    const line = raw.replace(/^[-•·▪︎◦*\s]+/, "");
    const m = line.match(/([+\-−▲▼△▽])\s?(\d+(?:\.\d+)?)\s?(%|bp)/i);
    if(!m) continue;
    let label = line.slice(0, m.index).replace(/[:：()\[\]]/g," ").trim();
    let prev;
    do{ prev = label; label = label.replace(/\s*[\d,.]+\s*(원|달러|bp|%|p|pt|엔)?$/i,"").trim(); }while(label !== prev);
    label = label.split(/\s{2,}|\|/)[0].replace(/[+\-−▲▼]+$/,"").trim();
    if(/[\d,.]+$/.test(label)) label = label.replace(/\s*[\d,.]+$/,"").trim();
    if(!label || label.length > 12 || label.split(/\s+/).length > 3) continue;
    if(/(에|과|와|가|는|은|를|을|서|도|로|의)$/.test(label) && label.length > 2) continue;
    const v = parseFloat(m[2]) * (/[\-−▼▽]/.test(m[1]) ? -1 : 1);
    const unit = m[3].toLowerCase() === "bp" ? "bp" : "%";
    if(unit === "%" && Math.abs(v) > 50) continue;
    if(!out.some(o => o.label === label)) out.push({label, v, unit});
    if(out.length >= 10) break;
  }
  return out;
}
function drawChart(p){
  const moves = extractMoves(p.text).filter(m => m.unit === "%");
  if(moves.length < 2) return null;
  const dark = true;
  const W = 1080, rowH = 78, top = 170, H = top + moves.length*rowH + 70;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const bg = "#0a0a0a", ink = "#d9d9d9", sub = "#7a7a7a";
  const up = "#ff5f56", down = "#4da3ff";
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  const font = (w,s) => `${w} ${s}px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
  g.fillStyle = "#ffb000"; g.font = font(800,44); g.fillText(`${chName(p.channel)}`, 48, 80);
  g.fillStyle = sub; g.font = font(500,28); g.fillText(`${fmtTime(p.date)} · 등락률(%)`, 48, 126);
  const max = Math.max(...moves.map(m => Math.abs(m.v)), 0.1);
  const labelW = 330, mid = labelW + (W - labelW - 60)/2, half = (W - labelW - 60)/2 - 90;
  g.strokeStyle = "#333333"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(mid, top-20); g.lineTo(mid, top + moves.length*rowH); g.stroke();
  moves.forEach((m,i) => {
    const y = top + i*rowH + rowH/2;
    g.fillStyle = ink; g.font = font(600,32); g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(m.label, 48, y);
    const len = Math.max(4, Math.abs(m.v)/max*half);
    g.fillStyle = m.v >= 0 ? up : down;
    const x = m.v >= 0 ? mid : mid - len;
    g.beginPath(); g.roundRect ? g.roundRect(x, y-20, len, 40, 8) : g.rect(x, y-20, len, 40); g.fill();
    g.font = font(800,30); g.textAlign = m.v >= 0 ? "left" : "right";
    g.fillText(`${m.v>0?"▲":"▼"}${Math.abs(m.v).toFixed(2)}%`, m.v >= 0 ? mid+len+12 : mid-len-12, y);
  });
  g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillStyle = sub; g.font = font(500,22);
  g.fillText("원문에서 자동 추출한 수치 · 원문 확인 필요", 48, H-30);
  return c;
}

/* ---------- 공유 시트 ---------- */
function openShare(uid){
  sharePost = DATA.posts.find(p => p.uid === uid);
  if(!sharePost) return;
  $("#optAi").checked = !!sharePost.ai; $("#optAi").disabled = !sharePost.ai;
  $("#aiOff").textContent = sharePost.ai ? "" :
    (isLinkOnly(sharePost) || sharePost.text.length < 80) ? "ⓘ 링크만 있거나 짧은 글이라 AI 코멘트가 없습니다"
    : "ⓘ AI 코멘트가 아직 없습니다 (Gemini 키 등록 후 자동 생성)";
  $("#shareText").value = buildShareText(sharePost, $("#optAi").checked);
  chartBlob = null;
  const canvas = drawChart(sharePost);
  $("#optChart").disabled = !canvas; $("#optChart").checked = !!canvas;
  $("#chartWrap").innerHTML = canvas ? "" : `<div class="off">ⓘ 등락 수치가 없어 텍스트만 보냅니다</div>`;
  if(canvas){
    const img = new Image(); img.src = canvas.toDataURL("image/png"); $("#chartWrap").appendChild(img);
    canvas.toBlob(b => chartBlob = b, "image/png");
  }
  $("#sheet").classList.remove("hidden");
}
async function doShare(){
  const text = $("#shareText").value;
  const files = ($("#optChart").checked && chartBlob) ? [new File([chartBlob], "chart.png", {type:"image/png"})] : [];
  try{
    if(files.length && navigator.canShare && navigator.canShare({files})){
      // 일부 앱은 파일과 텍스트를 함께 받으면 텍스트를 버리므로 텍스트를 클립보드에도 복사
      try{ await navigator.clipboard.writeText(text); }catch(e){}
      await navigator.share({files, text});
      toast("텍스트가 안 붙었으면 카톡 입력창에 '붙여넣기' 하세요");
    }else if(navigator.share){
      await navigator.share({text});
    }else{
      await navigator.clipboard.writeText(text);
      if(files.length){ const a = document.createElement("a"); a.href = URL.createObjectURL(chartBlob); a.download = "chart.png"; a.click(); }
      toast("복사 완료 · 카톡에 붙여넣기 하세요");
    }
    $("#sheet").classList.add("hidden");
  }catch(e){
    if(e.name !== "AbortError") toast("공유 실패: " + e.message);
  }
}

/* ---------- 이벤트 ---------- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  state.tab = b.dataset.tab; store.set("tab2", state.tab); render(); scrollTo(0,0);
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  state.chip = b.dataset.chip; store.set("chip2", state.chip); render(); scrollTo(0,0);
});
$("#feed").addEventListener("toggle", e => {
  const d = e.target; if(!d.matches || !d.matches("details.fold")) return;
  const f = store.get("fold", {}); f[d.dataset.fold] = !d.open; store.set("fold", f);
}, true);
$("#feed").addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if(go){ state.tab = "telegram"; state.chip = go.dataset.go; store.set("tab2","telegram"); store.set("chip2",state.chip); render(); scrollTo(0,0); return; }
  const more = e.target.closest(".more");
  if(more){ const body = more.previousElementSibling; const open = body.classList.toggle("clamp"); more.textContent = open ? "더보기 ▾" : "접기 ▴"; return; }
  const s = e.target.closest("[data-share]"); if(s) openShare(s.dataset.share);
});
$("#optAi").addEventListener("change", () => { if(sharePost) $("#shareText").value = buildShareText(sharePost, $("#optAi").checked); });
$("#sheetClose").addEventListener("click", () => $("#sheet").classList.add("hidden"));
$("#sheet").addEventListener("click", e => { if(e.target.id === "sheet") $("#sheet").classList.add("hidden"); });
$("#sheetSend").addEventListener("click", doShare);
$("#refreshBtn").addEventListener("click", () => refresh(true));
$("#settingsBtn").addEventListener("click", () => {
  const v = prompt("강조할 키워드 (쉼표로 구분)\n비우면 기본값 / '로그아웃' 입력 시 비밀번호 삭제", keywords.join(", "));
  if(v === null) return;
  if(v.trim() === "로그아웃"){ store.del("pw"); location.reload(); return; }
  keywords = v.trim() ? v.split(",").map(s=>s.trim()).filter(Boolean) : DEFAULT_KEYWORDS;
  store.set("keywords", keywords); render();
});

async function refresh(manual){
  try{
    const d = await loadData(PASSWORD);
    const changed = !DATA || d.updated !== DATA.updated;
    DATA = d; if(changed || manual) render();
    if(manual) toast(changed ? "새 데이터 반영" : "최신 상태입니다");
  }catch(e){ if(manual) toast("불러오기 실패: " + e.message); }
}
async function unlock(pw, remember){
  $("#lockMsg").textContent = "여는 중…";
  try{
    DATA = await loadData(pw);
    PASSWORD = pw;
    if(pw !== null){ if(remember) store.set("pw", pw); else store.del("pw"); }
    $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
    render();
    setInterval(() => refresh(false), 5*60*1000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(false); });
  }catch(e){
    $("#lockMsg").textContent = e.name === "OperationError" ? "비밀번호가 맞지 않습니다." : e.message;
  }
}
$("#unlockBtn").addEventListener("click", () => unlock($("#pw").value, $("#remember").checked));
$("#pw").addEventListener("keydown", e => { if(e.key === "Enter") $("#unlockBtn").click(); });
(async () => {
  // 비밀번호 없이 운영 중이면(data.json 존재) 잠금 화면을 건너뜀
  try{
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(r.ok){ await unlock(null, false); return; }
  }catch(e){}
  const saved = store.get("pw", null);
  if(saved) unlock(saved, true);
})();
</script>
