<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>내 시황</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-ink:#fff; --up:#dc2626; --down:#2563eb;
  --ai:#f5f3ff; --ai-line:#ddd6fe; --hl:#fef08a; --kakao:#fee500;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1020; --card:#151b2e; --ink:#e5e7eb; --sub:#94a3b8; --line:#263049;
    --accent:#3b82f6; --ai:#1e1b3a; --ai-line:#3b3470; --hl:#a16207; --up:#f87171; --down:#60a5fa; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* 잠금 화면 */
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
#lock h1{margin:0;font-size:24px}
#lock input{width:100%;max-width:320px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px}
#lock label{font-size:14px;color:var(--sub)}
.btn-primary{width:100%;max-width:320px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
#lockMsg{color:var(--up);font-size:14px;min-height:20px}

/* 헤더 + 2단 탭 */
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.top h1{margin:0;font-size:20px}
.top .meta{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}
.icon-btn{border:0;background:var(--card);border-radius:10px;width:38px;height:38px;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tabs{display:flex;gap:6px;padding:6px 16px}
.tab{flex:1;border:0;border-radius:12px;padding:11px 8px;background:var(--card);font-weight:700;color:var(--sub)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;position:relative}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--up);color:#fff;font-size:11px;text-align:center;font-weight:700}

/* 피드 */
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:8px}
.card-h b{color:var(--ink)}
.new{background:var(--up);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
.fwd{font-size:12px;color:var(--sub);margin-bottom:4px}
.body{white-space:pre-wrap;word-break:break-word;overflow:hidden}
.body.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.body a{color:var(--accent)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.more{border:0;background:none;color:var(--accent);padding:6px 0;font-size:14px}
.photos{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.photos img{height:120px;border-radius:10px;flex:none}
.docs{margin-top:8px;font-size:14px}
.docs div{padding:8px 10px;border:1px dashed var(--line);border-radius:10px;margin-top:4px}
details.ai{margin-top:10px;background:var(--ai);border:1px solid var(--ai-line);border-radius:12px;padding:0 12px}
details.ai summary{padding:10px 0;font-weight:700;font-size:14px;list-style:none}
details.ai summary::-webkit-details-marker{display:none}
details.ai summary::after{content:" ▸";color:var(--sub)}
details.ai[open] summary::after{content:" ▾"}
.ai-body{padding-bottom:10px;font-size:14px}
.ai-body p{margin:0 0 6px}
.ai-body .note{font-size:12px;color:var(--sub);margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}
.act{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:14px;text-align:center;text-decoration:none}
.act.kakao{background:var(--kakao);color:#191919}
.act.link{background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:60px 0}

/* 리포트 */
.rep{display:block;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:inherit;text-decoration:none}
.rep .t{font-weight:700;margin:2px 0}
.rep .s{font-size:13px;color:var(--sub)}

/* 공유 시트 */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet-in{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-in h2{margin:0 0 10px;font-size:17px}
.sheet-in textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;line-height:1.5}
.opts{display:flex;gap:16px;margin:10px 0;font-size:14px}
#chartWrap img{width:100%;border-radius:12px;border:1px solid var(--line)}
.sheet-btns{display:flex;gap:8px;margin-top:12px}
.sheet-btns button{flex:1;padding:14px;border:0;border-radius:12px;font-weight:700}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<section id="lock">
  <h1>📊 내 시황</h1>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <label><input id="remember" type="checkbox" checked> 이 기기에서 비밀번호 기억</label>
  <button class="btn-primary" id="unlockBtn">열기</button>
  <div id="lockMsg"></div>
</section>

<!-- 앱 -->
<section id="app" class="hidden">
  <header>
    <div class="top">
      <h1>📊 내 시황</h1>
      <div class="meta">
        <span id="updated">-</span>
        <button class="icon-btn" id="refreshBtn" aria-label="새로고침">🔄</button>
        <button class="icon-btn" id="settingsBtn" aria-label="키워드 설정">⚙️</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="telegram">✈️ 텔레그램</button>
      <button class="tab" data-tab="report">📄 리포트</button>
    </nav>
    <div class="chips" id="chips"></div>
  </header>
  <main id="feed"></main>
</section>

<!-- 카톡 공유 시트 -->
<div id="sheet" class="hidden">
  <div class="sheet-in">
    <h2>💬 카카오톡으로 보내기</h2>
    <textarea id="shareText"></textarea>
    <div class="opts">
      <label><input type="checkbox" id="optAi" checked> 🤖 AI 코멘트 포함</label>
      <label><input type="checkbox" id="optChart" checked> 📊 차트 이미지</label>
    </div>
    <div id="chartWrap"></div>
    <div class="sheet-btns">
      <button id="sheetClose" style="background:var(--bg)">닫기</button>
      <button id="sheetSend" style="background:var(--kakao);color:#191919">보내기</button>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
/* ---------- 저장소(브라우저) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const DEFAULT_KEYWORDS = ["FOMC","연준","파월","금통위","한은","금리","국채","환율","원/달러","CPI","PCE","고용","유가","반도체","엔비디아","관세"];
const EMOJI_RULES = [
  [/FOMC|연준|파월|Fed/i,"🏛️"],[/금통위|한은|한국은행/,"🏦"],[/국채|금리|채권|yield/i,"📜"],
  [/환율|원\/달러|달러|엔화|DXY/i,"💵"],[/유가|WTI|브렌트|원유/i,"🛢️"],[/금값|금 |gold/i,"🥇"],
  [/CPI|PPI|PCE|물가|인플레/i,"🧾"],[/고용|실업|NFP|비농업/,"👷"],[/반도체|엔비디아|NVIDIA|마이크론|SK하이닉스|삼성전자/i,"💾"],
  [/나스닥|S&P|다우|미국 증시|뉴욕/i,"🇺🇸"],[/코스피|코스닥|KOSPI/i,"🇰🇷"],[/중국|위안|항셍/,"🇨🇳"],
  [/일본|닛케이|BOJ/i,"🇯🇵"],[/비트코인|이더리움|크립토|BTC/i,"🪙"],[/관세|무역/,"🚢"]
];

let DATA = null, PASSWORD = null;
let state = { tab: store.get("tab","telegram"), chip: store.get("chip","all") };
let seen = store.get("seen", {});          // 채널별 마지막으로 본 메시지 ID
let seenAtOpen = {...seen};                // 이번 접속 시점의 기준(🆕 표시용)
let keywords = store.get("keywords", DEFAULT_KEYWORDS);
let sharePost = null, chartBlob = null;

/* ---------- 복호화 (Python 쪽 AES-GCM + PBKDF2와 동일) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptEnv(env, password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(env.salt), iterations:env.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.iv)}, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadData(password){
  const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("데이터 파일이 아직 없습니다. Actions가 한 번 실행되어야 합니다.");
  return decryptEnv(await r.json(), password);
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chName = id => (DATA.channels.find(c => c.id === id) || {name:id}).name;
const chEmoji = id => (DATA.channels.find(c => c.id === id) || {emoji:"📌"}).emoji;
function fmtTime(iso){
  const d = new Date(iso), now = new Date();
  const hm = d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"});
  const md = d.toLocaleDateString("ko-KR",{month:"numeric",day:"numeric",timeZone:"Asia/Seoul"});
  const today = now.toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul"}) === d.toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul"});
  return today ? hm : `${md} ${hm}`;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.add("hidden"), 2200); }
function richText(text){
  let h = esc(text).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const kw = keywords.filter(Boolean).map(k => k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(kw.length){
    const re = new RegExp(`(${kw.join("|")})(?![^<]*>)`, "gi");
    h = h.replace(re, "<mark>$1</mark>");
  }
  return h;
}

/* ---------- 렌더링 ---------- */
function postsFor(tab, chip){
  return DATA.posts.filter(p => (tab === "report" ? p.report : true) && (chip === "all" || p.channel === chip));
}
function renderChips(){
  const chans = DATA.channels.filter(c => (c.source || "telegram") === "telegram");
  const counts = {};
  for(const c of chans){
    counts[c.id] = DATA.posts.filter(p => p.channel === c.id && p.id > (seen[c.id] || 0) && (state.tab !== "report" || p.report)).length;
  }
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const chip = (id, label, n) => `<button class="chip ${state.chip===id?"on":""}" data-chip="${id}">${label}${n?`<span class="badge">${n}</span>`:""}</button>`;
  $("#chips").innerHTML = chip("all","전체",total) + chans.map(c => chip(c.id, `${c.emoji} ${esc(c.name)}`, counts[c.id])).join("");
}
function aiHtml(ai){
  if(!ai) return "";
  const li = arr => (arr||[]).map(x => `<p>${esc(x)}</p>`).join("");
  return `<details class="ai"><summary>🤖 AI 코멘트</summary><div class="ai-body">
    ${ai.key?`<p><b>${esc(ai.key)}</b></p>`:""}${li(ai.watch)}${li(ai.background)}
    ${ai.implication?`<p>${esc(ai.implication)}</p>`:""}
    <div class="note">${esc(ai.model||"AI")} 생성 · 투자 판단 참고용이며 사실 여부는 원문 확인 필요</div></div></details>`;
}
function cardHtml(p){
  const isNew = p.id > (seenAtOpen[p.channel] || 0);
  const long = p.text.split("\n").length > 6 || p.text.length > 260;
  return `<article class="card" data-uid="${esc(p.uid)}">
    <div class="card-h">${chEmoji(p.channel)} <b>${esc(chName(p.channel))}</b> · ${fmtTime(p.date)} ${isNew?'<span class="new">NEW</span>':""}</div>
    ${p.forwarded?`<div class="fwd">↪︎ ${esc(p.forwarded)}에서 전달</div>`:""}
    <div class="body ${long?"clamp":""}">${richText(p.text)}</div>
    ${long?'<button class="more">더보기 ▾</button>':""}
    ${p.photos&&p.photos.length?`<div class="photos">${p.photos.map(u=>`<img loading="lazy" src="${esc(u)}" alt="">`).join("")}</div>`:""}
    ${p.docs&&p.docs.length?`<div class="docs">${p.docs.map(d=>`<div>📎 ${esc(d)}</div>`).join("")}</div>`:""}
    ${aiHtml(p.ai)}
    <div class="actions">
      <button class="act kakao" data-share="${esc(p.uid)}">💬 카톡</button>
      <a class="act link" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 원문</a>
    </div></article>`;
}
function reportHtml(p){
  const title = (p.docs && p.docs[0]) || p.text.split("\n").find(l => l.trim()) || "리포트";
  const pdf = (p.links||[]).find(l => /\.pdf($|\?)/i.test(l)) || p.links[0] || p.url;
  return `<a class="rep" href="${esc(pdf)}" target="_blank" rel="noopener">
    <div class="s">${chEmoji(p.channel)} ${esc(chName(p.channel))} · ${fmtTime(p.date)}</div>
    <div class="t">📄 ${esc(title.slice(0,80))}</div>
    <div class="s">${esc(p.text.replace(/\s+/g," ").slice(0,90))}</div></a>`;
}
function render(){
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  markSeen();
  renderChips();
  const list = postsFor(state.tab, state.chip);
  $("#feed").innerHTML = list.length
    ? (state.tab === "report" ? list.map(reportHtml).join("") : list.slice(0,150).map(cardHtml).join(""))
    : `<div class="empty">표시할 글이 없습니다.</div>`;
  $("#updated").textContent = "갱신 " + fmtTime(DATA.updated);
}
function markSeen(){
  const ids = state.chip === "all" ? DATA.channels.map(c=>c.id) : [state.chip];
  if(state.tab === "report") return;
  for(const id of ids){
    const max = Math.max(0, ...DATA.posts.filter(p=>p.channel===id).map(p=>p.id));
    if(max > (seen[id]||0)) seen[id] = max;
  }
  store.set("seen", seen);
}

/* ---------- 카톡 공유: 이모지 텍스트 ---------- */
function decorateLine(line){
  let l = line.trim().replace(/^[-•·▪︎◦*]\s*/, "");
  if(!l) return "";
  const em = EMOJI_RULES.find(([re]) => re.test(l));
  const pct = l.match(/([+\-−▲▼△▽])\s?\d+(\.\d+)?\s?(%|bp)/);
  let trend = "";
  if(pct) trend = /[+▲△]/.test(pct[1]) ? " 📈" : " 📉";
  return `${em ? em[1] + " " : "▪️ "}${l}${trend}`;
}
function buildShareText(p, withAi){
  const lines = p.text.split("\n").map(decorateLine).filter(Boolean);
  const head = `📊 [${chName(p.channel)}] ${fmtTime(p.date)}`;
  let body = lines.slice(0,14).join("\n");
  if(lines.length > 14) body += "\n… (이하 원문 참고)";
  let ai = "";
  if(withAi && p.ai){
    ai = "\n\n🤖 AI 코멘트\n" + [p.ai.key, ...(p.ai.watch||[]), p.ai.implication].filter(Boolean).join("\n");
  }
  return `${head}\n\n${body}${ai}\n\n🔗 원문: ${p.url}`;
}

/* ---------- 카톡 공유: 등락 차트 이미지 ---------- */
function extractMoves(text){
  const out = [];
  for(const raw of text.split("\n")){
    const line = raw.replace(/^[-•·▪︎◦*\s]+/, "");
    const m = line.match(/([+\-−▲▼△▽])\s?(\d+(?:\.\d+)?)\s?%/);
    if(!m) continue;
    let label = line.slice(0, m.index).replace(/[\d,.]+\s*$/,"").replace(/[:：()\[\]]/g," ").trim();
    label = label.split(/\s{2,}|,|\|/)[0].trim().slice(0,14);
    if(!label || label.length < 2) continue;
    const v = parseFloat(m[2]) * (/[\-−▼▽]/.test(m[1]) ? -1 : 1);
    if(Math.abs(v) > 50) continue;
    if(!out.some(o => o.label === label)) out.push({label, v});
    if(out.length >= 10) break;
  }
  return out;
}
function drawChart(p){
  const moves = extractMoves(p.text);
  if(moves.length < 2) return null;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const W = 1080, rowH = 78, top = 170, H = top + moves.length*rowH + 70;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const bg = dark ? "#151b2e" : "#ffffff", ink = dark ? "#e5e7eb" : "#111827", sub = dark ? "#94a3b8" : "#6b7280";
  const up = "#dc2626", down = "#2563eb";
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  const font = (w,s) => `${w} ${s}px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
  g.fillStyle = ink; g.font = font(800,44); g.fillText(`📊 ${chName(p.channel)}`, 48, 80);
  g.fillStyle = sub; g.font = font(500,28); g.fillText(`${fmtTime(p.date)} · 등락률(%)`, 48, 126);
  const max = Math.max(...moves.map(m => Math.abs(m.v)), 0.1);
  const labelW = 330, mid = labelW + (W - labelW - 60)/2, half = (W - labelW - 60)/2 - 90;
  g.strokeStyle = dark ? "#263049" : "#e5e7eb"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(mid, top-20); g.lineTo(mid, top + moves.length*rowH); g.stroke();
  moves.forEach((m,i) => {
    const y = top + i*rowH + rowH/2;
    g.fillStyle = ink; g.font = font(600,32); g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(m.label, 48, y);
    const len = Math.max(4, Math.abs(m.v)/max*half);
    g.fillStyle = m.v >= 0 ? up : down;
    const x = m.v >= 0 ? mid : mid - len;
    g.beginPath(); g.roundRect ? g.roundRect(x, y-20, len, 40, 8) : g.rect(x, y-20, len, 40); g.fill();
    g.font = font(800,30); g.textAlign = m.v >= 0 ? "left" : "right";
    g.fillText(`${m.v>0?"▲":"▼"}${Math.abs(m.v).toFixed(2)}%`, m.v >= 0 ? mid+len+12 : mid-len-12, y);
  });
  g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillStyle = sub; g.font = font(500,22);
  g.fillText("원문에서 자동 추출한 수치 · 원문 확인 필요", 48, H-30);
  return c;
}

/* ---------- 공유 시트 ---------- */
function openShare(uid){
  sharePost = DATA.posts.find(p => p.uid === uid);
  if(!sharePost) return;
  $("#optAi").checked = !!sharePost.ai; $("#optAi").disabled = !sharePost.ai;
  $("#shareText").value = buildShareText(sharePost, $("#optAi").checked);
  chartBlob = null;
  const canvas = drawChart(sharePost);
  $("#optChart").disabled = !canvas; $("#optChart").checked = !!canvas;
  $("#chartWrap").innerHTML = canvas ? "" : `<div class="s" style="color:var(--sub);font-size:13px">수치를 추출하지 못해 텍스트만 보냅니다.</div>`;
  if(canvas){
    const img = new Image(); img.src = canvas.toDataURL("image/png"); $("#chartWrap").appendChild(img);
    canvas.toBlob(b => chartBlob = b, "image/png");
  }
  $("#sheet").classList.remove("hidden");
}
async function doShare(){
  const text = $("#shareText").value;
  const files = ($("#optChart").checked && chartBlob) ? [new File([chartBlob], "chart.png", {type:"image/png"})] : [];
  try{
    if(files.length && navigator.canShare && navigator.canShare({files})){
      // 일부 앱은 파일과 텍스트를 함께 받으면 텍스트를 버리므로 텍스트를 클립보드에도 복사
      try{ await navigator.clipboard.writeText(text); }catch(e){}
      await navigator.share({files, text});
      toast("텍스트가 안 붙었으면 카톡 입력창에 '붙여넣기' 하세요");
    }else if(navigator.share){
      await navigator.share({text});
    }else{
      await navigator.clipboard.writeText(text);
      if(files.length){ const a = document.createElement("a"); a.href = URL.createObjectURL(chartBlob); a.download = "chart.png"; a.click(); }
      toast("복사 완료 · 카톡에 붙여넣기 하세요");
    }
    $("#sheet").classList.add("hidden");
  }catch(e){
    if(e.name !== "AbortError") toast("공유 실패: " + e.message);
  }
}

/* ---------- 이벤트 ---------- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  state.tab = b.dataset.tab; store.set("tab", state.tab); render(); scrollTo(0,0);
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  state.chip = b.dataset.chip; store.set("chip", state.chip); render(); scrollTo(0,0);
});
$("#feed").addEventListener("click", e => {
  const more = e.target.closest(".more");
  if(more){ const body = more.previousElementSibling; const open = body.classList.toggle("clamp"); more.textContent = open ? "더보기 ▾" : "접기 ▴"; return; }
  const s = e.target.closest("[data-share]"); if(s) openShare(s.dataset.share);
});
$("#optAi").addEventListener("change", () => { if(sharePost) $("#shareText").value = buildShareText(sharePost, $("#optAi").checked); });
$("#sheetClose").addEventListener("click", () => $("#sheet").classList.add("hidden"));
$("#sheet").addEventListener("click", e => { if(e.target.id === "sheet") $("#sheet").classList.add("hidden"); });
$("#sheetSend").addEventListener("click", doShare);
$("#refreshBtn").addEventListener("click", () => refresh(true));
$("#settingsBtn").addEventListener("click", () => {
  const v = prompt("강조할 키워드 (쉼표로 구분)\n비우면 기본값 / '로그아웃' 입력 시 비밀번호 삭제", keywords.join(", "));
  if(v === null) return;
  if(v.trim() === "로그아웃"){ store.del("pw"); location.reload(); return; }
  keywords = v.trim() ? v.split(",").map(s=>s.trim()).filter(Boolean) : DEFAULT_KEYWORDS;
  store.set("keywords", keywords); render();
});

async function refresh(manual){
  try{
    const d = await loadData(PASSWORD);
    const changed = !DATA || d.updated !== DATA.updated;
    DATA = d; if(changed || manual) render();
    if(manual) toast(changed ? "새 데이터 반영" : "최신 상태입니다");
  }catch(e){ if(manual) toast("불러오기 실패: " + e.message); }
}
async function unlock(pw, remember){
  $("#lockMsg").textContent = "여는 중…";
  try{
    DATA = await loadData(pw);
    PASSWORD = pw;
    if(remember) store.set("pw", pw); else store.del("pw");
    $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
    if(state.chip !== "all" && !DATA.channels.some(c=>c.id===state.chip)) state.chip = "all";
    render();
    setInterval(() => refresh(false), 5*60*1000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(false); });
  }catch(e){
    $("#lockMsg").textContent = e.name === "OperationError" ? "비밀번호가 맞지 않습니다." : e.message;
  }
}
$("#unlockBtn").addEventListener("click", () => unlock($("#pw").value, $("#remember").checked));
$("#pw").addEventListener("keydown", e => { if(e.key === "Enter") $("#unlockBtn").click(); });
const saved = store.get("pw", null);
if(saved) unlock(saved, true);
</script>
